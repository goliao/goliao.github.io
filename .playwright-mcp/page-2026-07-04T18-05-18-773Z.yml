        - paragraph [ref=e17]: "Gordon Y. Liao is Chief Economist and Head of Research at Circle (NYSE: CRCL), issuer of USDC. An economist bridging traditional finance and digital assets, he has shaped monetary-policy analysis at the Federal Reserve Board, led research at Uniswap Labs, and managed fixed-income portfolios at the Harvard endowment. His research on stablecoins, exchange rates, and market structure appears in the Review of Financial Studies and the Journal of Financial Economics. He holds a Ph.D. in Economics and an A.B. in Applied Mathematics from Harvard."
