  - main [ref=f2e11]:
    - heading "Speaking" [level=1] [ref=f2e12]
    - paragraph [ref=f2e13]: "Gordon Y. Liao is Chief Economist and Head of Research at Circle (NYSE: CRCL), issuer of USDC. An economist bridging traditional finance and digital assets, he has shaped monetary-policy analysis at the Federal Reserve Board, led research at Uniswap Labs, and managed fixed-income portfolios at the Harvard endowment. His research on stablecoins, exchange rates, and market structure appears in the Review of Financial Studies and the Journal of Financial Economics. He holds a Ph.D. in Economics and an A.B. in Applied Mathematics from Harvard."
    - generic [ref=f2e14]: Talk topics
    - generic [ref=f2e15]:
      - text: The Stablecoin Standard
      - paragraph [ref=f2e16]: How payment stablecoins become reserve infrastructure for the digital dollar — from an economist who helped write the capital rules (TCAF).
    - generic [ref=f2e17]:
      - text: From the Fed to DeFi
      - paragraph [ref=f2e18]: What central banks, DeFi protocols, and public companies each get wrong about the other — lessons from working inside all three.
    - generic [ref=f2e19]:
      - text: Quantum Risk Is Crypto's Y2K
      - paragraph [ref=f2e20]: The unaddressed vulnerability in blockchain security and the roadmap for post-quantum digital assets.
