role: "Chief Economist & Head of Research · Circle (NYSE: CRCL)"
headshot: "/img/headshot_GL_4ss.jpg"

bio_short: >-
  Gordon Y. Liao is Chief Economist and Head of Research at Circle (NYSE: CRCL),
  the issuer of USDC, where he leads economic research and R&D — from the design
  of Arc, a Layer-1 blockchain purpose-built for stablecoin finance, to capital
  standards for digital dollars and post-quantum security. He previously served
  as a senior economist at the Federal Reserve Board, led research at Uniswap
  Labs, and managed fixed-income portfolios at the Harvard endowment. His research
  appears in the Review of Financial Studies and the Journal of Financial
  Economics. He holds a Ph.D. in Economics and an A.B. in Applied Mathematics
  from Harvard.

bio_long: >-
  Gordon Y. Liao serves as Chief Economist and Head of Research at Circle
  (NYSE: CRCL), the issuer of USDC, where he leads economic research and R&D
  spanning stablecoin capital adequacy (the Token Capital Adequacy Framework),
  the design of Arc, an economically-secured Layer-1 blockchain, and post-quantum
  security for digital assets. His career bridges traditional finance and digital
  assets: he advised on short-term funding markets as a senior economist at the
  Federal Reserve Board of Governors, led research at Uniswap Labs, worked on
  machine learning and AI at Kensho Technologies, and managed fixed-income
  portfolios at Harvard Management Company. His academic research on
  exchange rates, credit markets, and stablecoins appears in the Review of
  Financial Studies, the Journal of Financial Economics, and the Journal of
  Financial Regulation. He is a Term Member of the Council on Foreign Relations, a Cornell
  FinTech Fellow, co-chair of the NABE Finance Roundtable, and a member of a
  World Economic Forum Global Future Council. His work has been featured in Bloomberg, the Wall
  Street Journal, the Financial Times, and Barron's. He holds a Ph.D. and A.M.
  in Economics and an A.B. in Applied Mathematics from Harvard University.

