speaking_topics:
  - title: "The Stablecoin Standard"
    blurb: "How payment stablecoins become reserve infrastructure for the digital dollar — from an economist who helped write the capital rules for stablecoin issuers."
  - title: "From the Fed to DeFi"
    blurb: "What central banks, DeFi protocols, and public companies each get wrong about the other — lessons from working inside all three."
  - title: "The Agentic Economy"
    blurb: "What happens when AI agents can hold and move money — how autonomous transactions drive costs toward zero and redraw the boundaries of firms, payments, and commerce."
  - title: "Quantum Risk Is Crypto's Y2K"
    blurb: "The unaddressed vulnerability in blockchain security and the roadmap for post-quantum digital assets."

